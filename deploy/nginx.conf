# nginx config for the LeadTax site (used by the Dockerfile; Coolify's proxy handles TLS).

# Send www.leadtax.ca to leadtax.ca, the host Google indexes.
server {
    listen 80;
    server_name www.leadtax.ca;
    return 301 https://leadtax.ca$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    # Security headers (repeated in each location that adds its own headers).
    set $csp_report "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.google-analytics.com https://www.gstatic.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://www.google.com https://widget.intercom.io https://js.intercomcdn.com https://*.wistia.com https://*.wistia.net https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://js.intercomcdn.com https://fonts.intercomcdn.com https://*.wistia.net; connect-src 'self' https: wss://*.intercom.io; frame-src https://www.google.com https://maps.google.com https://www.googletagmanager.com https://td.doubleclick.net https://*.wistia.net https://*.wistia.com https://intercom-sheets.com https://www.intercom-reporting.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self' https://app.leadtax.ca https://portal.leadtax.ca";

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Report-only first: third-party tags added through Google Tag Manager may need more sources.
    # Switch to Content-Security-Policy once the browser console shows no reports.
    add_header Content-Security-Policy-Report-Only $csp_report always;

    # Old pages that no longer exist: permanent redirects keep their search ranking.
    location = /sign-in              { return 301 https://app.leadtax.ca/user/auth/login; }
    location = /diy-landing          { return 301 /file-online$is_args$args; }
    location = /dyi-landing          { return 301 /file-online$is_args$args; }
    location = /file-remote-landing  { return 301 /file-remotely; }
    location = /home-v2              { return 301 /$is_args$args; }
    location = /home-legacy          { return 301 /$is_args$args; }
    location = /home-redesign        { return 301 /us-cross-border$is_args$args; }
    location = /business-tax         { return 301 /corporate-tax$is_args$args; }
    location = /cross-border-tax     { return 301 /us-cross-border$is_args$args; }

    # Remove trailing slashes (except the homepage) so each page has one URL.
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages are pre-rendered to /<route>/index.html; anything else is a real 404.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
